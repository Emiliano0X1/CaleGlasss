# Forge app manifest (Atlassian). Base: jira-issue-panel-ui-kit template.
#
# Active today: the issue panel (src/frontend/index.jsx + resolvers/index.ts), the web
# triggers `debug`, `glasses` (writes to SpacetimeDB, sends the receipt, queues the agent)
# and `telegram` (bot webhook, ✅ approvals), and the `agent-runs` queue consumer (Claude
# proposes a plan; after approval, execute/actions.ts applies it in Jira). The reporter agent
# reads Jira and Confluence and publishes its report as a Confluence page (the app is also
# installed on Confluence: forge install --product confluence).
#
# Secrets (encrypted Forge variables, never in the code): STDB_TOKEN, APPROVAL_SECRET,
# TELEGRAM_BOT_TOKEN, TELEGRAM_SECRET, ANTHROPIC_API_KEY.
#
# TODO (agents):
# - [ ] Adjust the scopes to what lib/jira.ts and lib/confluence.ts really use.
# - [ ] Run `forge lint` and `forge deploy`; if the scopes change, `forge install --upgrade`.
# - [ ] (extra) Module and resource for static/panel/ (Custom UI).

modules:
  jira:issuePanel:
    - key: eyeclick-agents-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: eyeclick-agents
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  webtrigger:
    - key: debug-webtrigger            # reads a sprint with JQL (triggers/debug.ts); debugging only
      function: debug
    - key: glasses-webtrigger          # requests from the glasses; called by eyeclick/bridge/forge_client.py
      function: glasses
    - key: telegram-webtrigger         # Telegram bot webhook (registered with setWebhook)
      function: telegram
  consumer:
    - key: agent-runs-consumer
      queue: agent-runs                # same name as QUEUE_KEY in src/queue/consumer.ts
      function: consume-queue
  function:
    - key: resolver
      handler: index.handler
    - key: debug
      handler: index.debug
    - key: glasses
      handler: index.glasses
    - key: telegram
      handler: index.telegram
    - key: consume-queue               # queue consumer: calls Claude, so it gets more time
      handler: index.consume
      timeoutSeconds: 300              # up to 15 Claude turns (agents/loop.ts)

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e90acf6a-96a9-475b-a7e4-e0e187188330

permissions:
  scopes:
    - read:jira-work                   # JQL search, issues, transitions (lib/jira.ts)
    - read:jira-user                   # find_person: user search (lib/jira.ts)
    - read:sprint:jira-software
    - read:board-scope:jira-software
    - read:issue:jira-software         # GET /rest/agile/1.0/issue/{key} (readIssue: current sprint)
    - write:jira-work                  # transition, assign, priority, comment (execute/actions.ts)
    - write:sprint:jira-software       # move issues to a sprint (execute/actions.ts)
    - read:page:confluence             # reporter: read_page, example report, parent page (lib/confluence.ts)
    - write:page:confluence            # publish_page (execute/actions.ts)
    - read:space:confluence            # space by key
    - search:confluence                # search_pages (CQL)
  external:
    fetch:
      backend:
        - address: maincloud.spacetimedb.com   # SpacetimeDB (lib/stdb.ts)
        - address: api.telegram.org            # Telegram bot (lib/telegram.ts)
        - address: api.anthropic.com           # Claude (lib/claude.ts)
