# Forge app manifest (Atlassian). Base: jira-issue-panel-ui-kit template.
#
# Active today: the issue panel (src/frontend/index.jsx + resolvers/index.ts), the
# `debug` web trigger and the `glasses` web trigger (writes to SpacetimeDB). The rest of
# the agents' modules are commented out below: they get enabled once their handlers are
# implemented, so the app doesn't ask for unused scopes.
#
# Secrets (encrypted Forge variables, never in the code): STDB_TOKEN, APPROVAL_SECRET.
#
# TODO (agents):
# - [ ] When telegram and queue/ are implemented, uncomment their modules and functions.
# - [ ] Adjust the scopes to what lib/jira.ts and lib/confluence.ts really use.
# - [ ] Run `forge lint` and `forge deploy`; if the scopes change, `forge install --upgrade`.
# - [ ] (extra) Module and resource for static/panel/ (Custom UI).

modules:
  jira:issuePanel:
    - key: eyeclick-agents-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: eyeclick-agents
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  webtrigger:
    - key: debug-webtrigger            # reads a sprint with JQL (triggers/debug.ts); debugging only
      function: debug
    - key: glasses-webtrigger          # requests from the glasses; called by eyeclick/bridge/forge_client.py
      function: glasses
  #   - key: telegram-webtrigger         # Telegram bot webhook
  #     function: telegram
  # consumer:
  #   - key: jobs-consumer
  #     queue: agent-jobs                # router, agent and execute go through this queue
  #     resolver:
  #       function: consumer
  #       method: job
  function:
    - key: resolver
      handler: index.handler
    - key: debug
      handler: index.debug
    - key: glasses
      handler: index.glasses
    # - key: telegram
    #   handler: index.telegram
    # - key: consumer
    #   handler: index.consumer

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/e90acf6a-96a9-475b-a7e4-e0e187188330

permissions:
  scopes:
    - read:jira-work                   # JQL search (triggers/debug.ts)
    - read:sprint:jira-software
    - read:board-scope:jira-software
    # Enabled together with the agents' modules:
    # - write:jira-work
    # - read:confluence-content.all
    # - write:confluence-content
  external:
    fetch:
      backend:
        - address: maincloud.spacetimedb.com   # SpacetimeDB (lib/stdb.ts)
        # Enabled together with the agents' modules:
        # - address: api.anthropic.com
        # - address: api.telegram.org
